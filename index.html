<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#06051a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PRD Review</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: #06051a;
    color: #f3f1ff;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse at 50% 28%, #1a2850 0%, #06051a 62%);
  }
  .card {
    width: min(92vw, 22rem);
    text-align: center;
    padding: 2.2rem 1.4rem 1.8rem;
  }
  h1 {
    margin: 0 0 .35rem;
    font-weight: 200;
    letter-spacing: .42em;
    font-size: 1.7rem;
    text-indent: .42em;
    background: linear-gradient(180deg, #fff8e6 0%, #ffd890 50%, #b9a6ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.tag {
    margin: 0 0 1.8rem;
    opacity: .45;
    font-size: .78rem;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  form { display: flex; flex-direction: column; gap: .75rem; }
  input[type="password"] {
    width: 100%;
    border: 1px solid rgba(255, 216, 144, .22);
    background: rgba(8,7,24,.65);
    color: #fff8e6;
    border-radius: 999px;
    padding: .95rem 1.2rem;
    font-size: 16px;
    letter-spacing: .06em;
    outline: none;
    text-align: center;
  }
  input[type="password"]:focus {
    border-color: rgba(255, 216, 144, .55);
    box-shadow: 0 0 0 3px rgba(255, 200, 120, .15);
  }
  button {
    border: 0;
    border-radius: 999px;
    padding: .95rem 1.2rem;
    font-size: .95rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #140e06;
    background: linear-gradient(180deg, #fff0c8, #ffd890);
    cursor: pointer;
    font-weight: 600;
  }
  button[disabled] { opacity: .55; cursor: default; }
  .err {
    min-height: 1.2rem;
    margin: .8rem 0 0;
    color: #ffb4c4;
    font-size: .85rem;
    opacity: 0;
    transition: opacity .2s;
  }
  .err.show { opacity: 1; }
  body.loading .card { visibility: hidden; }
</style>
</head>
<body class="loading">
  <div class="card">
    <h1>PRD REVIEW</h1>
    <p class="tag">Private review</p>
    <form id="f" autocomplete="current-password">
      <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="Password" inputmode="numeric" autofocus>
      <button type="submit" id="go">Unlock</button>
    </form>
    <p class="err" id="err"></p>
  </div>
<script>
(function () {
  const form = document.getElementById('f');
  const input = document.getElementById('pw');
  const btn = document.getElementById('go');
  const err = document.getElementById('err');
  const KEY = 'prd-review.unlock';

  function showErr(msg) {
    err.textContent = msg || 'Wrong password';
    err.classList.add('show');
  }
  function hideErr() { err.classList.remove('show'); err.textContent = ''; }

  function b64(s) {
    const bin = atob(s);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function b64e(bytes) { let s = ''; for (const b of bytes) s += String.fromCharCode(b); return btoa(s); }

  async function derive(password, payload) {
    const salt = b64(payload.salt);
    const base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: payload.iter, hash: 'SHA-256' },
      base,
      { name: 'AES-GCM', length: 256 }, true,
      ['decrypt']
    );
  }
  async function decryptKey(key, payload) {
    const iv = b64(payload.iv), tag = b64(payload.tag), data = b64(payload.data);
    const combined = new Uint8Array(data.length + tag.length); combined.set(data); combined.set(tag, data.length);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, combined);
    return new TextDecoder().decode(plain);
  }
  async function decrypt(password, payload) { return decryptKey(await derive(password, payload), payload); }

  async function unlock(password, remember, silent = false, cached = null) {
    hideErr();
    btn.disabled = true;
    if (!silent) btn.textContent = '…';
    try {
      const payload = await fetch('payload.json', { cache: 'no-store' }).then((r) => {
        if (!r.ok) throw new Error('load');
        return r.json();
      });
      let key = cached;
      if (!key) key = await derive(password, payload);
      const html = await decryptKey(key, payload);
      try { const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key)); localStorage.setItem(KEY+'.key', JSON.stringify({salt:payload.salt,raw:b64e(raw)})); } catch (e) {}
      if (remember) {
        try { sessionStorage.setItem(KEY, password); localStorage.setItem(KEY, password); } catch (e) {}
      }
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.body.classList.remove('loading');
      btn.disabled = false;
      btn.textContent = 'Unlock';
      showErr(e && e.message === 'load' ? 'Could not load review. Try again.' : 'Wrong password');
      input.focus();
      input.select();
      if (silent) throw e;
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const pw = input.value;
    if (!pw) { input.focus(); return; }
    unlock(pw, true);
  });

  try {
    const boot = async () => {
      const payload = await fetch('payload.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error('load'); return r.json(); });
      let cached = null;
      try { const c = JSON.parse(localStorage.getItem(KEY+'.key') || 'null'); if (c && c.salt === payload.salt) cached = await crypto.subtle.importKey('raw', b64(c.raw), {name:'AES-GCM'}, false, ['decrypt']); } catch (e) {}
      if (cached) { try { await unlock('', false, true, cached); return; } catch (e) {} }
      const saved = sessionStorage.getItem(KEY) || localStorage.getItem(KEY);
      if (saved) { try { await unlock(saved, false, true); return; } catch (e) {} }
      document.body.classList.remove('loading');
    };
    boot().catch(() => document.body.classList.remove('loading'));
  } catch (e) {}
})();
</script>
</body>
</html>
